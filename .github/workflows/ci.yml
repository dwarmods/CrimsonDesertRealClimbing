name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: python -m pip install --disable-pip-version-check "ziglang==0.17.1" pefile
      - name: Public-repo guard (no game files, no local paths)
        run: python tools/check_no_game_files.py
      - name: Offline tests
        run: python -m unittest discover -s plugin/tests -p "test_*.py" -v
      - name: Build ClimbmodASI (zig, x86_64-windows-gnu)
        run: ZIG="python -m ziglang" bash plugin/build.sh
      - name: Check built DLL
        run: python plugin/tests/check_dll.py
      - uses: actions/upload-artifact@v4
        with:
          name: ClimbmodASI-${{ github.sha }}
          path: |
            plugin/dist/ClimbmodASI.asi
            plugin/dist/ClimbmodASI.ini
          if-no-files-found: error
