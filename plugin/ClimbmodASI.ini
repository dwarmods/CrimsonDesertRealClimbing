; Climbmod ASI 0.1.1-diag  (Crimson Desert exe 1.0.0.3663 [Nov 9 2026 update] and 1.0.0.3576 only)
; Diagnostic build: observes climbing and looks for the climbmod ice axes in
; memory. It never changes animation, visibility, stamina or any game data.
; Any other game build: logs "unknown game build" and does nothing.
; Log file: ClimbmodASI.log next to ClimbmodASI.asi (with DMM: the game's bin64 folder).
[climbmod]
; 0 = plugin does nothing at all
Enabled=1
; 0 = no log, 1 = climb begin/end + scan results, 2 = also every class seen and call counts
LogLevel=2
; observe PointClimbMovementMethod begin/end/update through its vtable (calls the original every time)
HookPointClimb=1
; on climb begin, read-only search from the climb object for EquipSlot components and item keys 1990000-1990002
EquipScan=1
; how many climb begins get a scan per session (0-64)
MaxScans=8
; objects visited per scan (50-4000)
ScanNodeBudget=600
; NOT IMPLEMENTED in this build (accepted and ignored, logged). Reserved for the clip swap.
AnimSwap=0
; NOT IMPLEMENTED in this build (accepted and ignored, logged). Reserved for keeping the axes in hand.
KeepAxesDrawn=0
