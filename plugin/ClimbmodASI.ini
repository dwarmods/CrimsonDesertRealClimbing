; Climbmod ASI 0.1.5-diag  (Crimson Desert exe 1.0.0.3663 [Nov 9 2026 update] and 1.0.0.3576 only)
; Diagnostic build. On each climb (up to MaxProbes) it READS game memory to find out
; how the game stores the climbmod items you carry:
;  - [census]  counts every copy of item keys 1990000/1/2 in writable memory and which
;              copies appear/disappear between climbs (carry different gear each time),
;  - [owners]  counts the pointers to those copies (inventory entries may point at the
;              item's data row instead of storing the key),
;  - [inv]     a narrowed walk of the inventory component's own containers,
;  - [track]   1 Hz: a stamina-like value plus climb-state fields, on the wall and 8 s after.
; The census/owner scans take a few seconds on a background thread per probed climb; a
; short hitch is possible. It never changes animation, stamina, equipment or game data.
; Any other game build: logs "unknown game build" and does nothing.
; Log file: ClimbmodASI.log next to ClimbmodASI.asi (the game's bin64 folder).
[climbmod]
; 0 = plugin does nothing at all
Enabled=1
; 0 = no log, 1 = targeted results only (recommended), 2 = also every grab and call counts
LogLevel=1
; observe PointClimbMovementMethod begin/end/update through its vtable (calls the original every time)
HookPointClimb=1
; run the census / owners / inventory probes on climb sessions
Probe=1
; how many climb sessions get probed per game launch (0-64). A session = from grabbing a wall to >1.5 s off it.
MaxProbes=8
; NOT IMPLEMENTED in this build (accepted, logged, ignored). Reserved: authored plant/hold clip swap.
AnimSwap=0
; NOT IMPLEMENTED in this build (accepted, logged, ignored). Reserved: axe hand props while climbing.
KeepAxesDrawn=0
