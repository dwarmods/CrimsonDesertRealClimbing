; Climbmod ASI 0.1.4-diag  (Crimson Desert exe 1.0.0.3663 [Nov 9 2026 update] and 1.0.0.3576 only)
; Diagnostic build: observes climbing and READS game memory to pin down
;  - whether climbmod axes/crampons are in the INVENTORY (no equipping needed),
;    and what changed in the inventory between climbs (carry different gear each time),
;  - which fields change when you are holding on a wall vs off it
;    (current animation node / movement mode, axe stow state),
;  - values that fall while climbing and recover off the wall (stamina candidates).
; It never changes animation, visibility, stamina, equipment or game data.
; Any other game build: logs "unknown game build" and does nothing.
; Log file: ClimbmodASI.log next to ClimbmodASI.asi (with DMM: the game's bin64 folder).
[climbmod]
; 0 = plugin does nothing at all
Enabled=1
; 0 = no log, 1 = targeted results only (recommended), 2 = also every grab and call counts
LogLevel=1
; observe PointClimbMovementMethod begin/end/update through its vtable (calls the original every time)
HookPointClimb=1
; run the inventory / equip / wall-vs-off state probes on climb sessions
Probe=1
; how many climb sessions get probed per game launch (0-64). A session = from grabbing a wall to >1.5 s off it.
MaxProbes=8
; NOT IMPLEMENTED in this build (accepted, logged, ignored). Reserved: authored plant/hold clip swap.
AnimSwap=0
; NOT IMPLEMENTED in this build (accepted, logged, ignored). Reserved: axe hand props while climbing.
KeepAxesDrawn=0
